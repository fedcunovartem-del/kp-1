<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вікторина</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Вікторина</h1>
        <nav>
            <ul>
                <li><a href="#question-section">Питання</a></li>
                <li><a href="#history-section">Результати</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Блок прогресу -->
        <section id="progress-section">
            <h2>Прогрес</h2>
            <div class="progress-container">
                <span class="progress-label">Питання <span class="large-question-num" id="current-question-num">1</span> з <span id="total-questions-num">10</span></span>
            </div>
            <progress id="quiz-progress" value="1" max="10"></progress>
        </section>

        <!-- Блок списку питань -->
        <section id="question-section" class="question-card">
            <h2>Поточне питання</h2>

            <div class="progress-container">
                <span class="progress-label">Питання <span class="large-question-num" id="current-question-num">1</span> з <span id="total-questions-num">3</span></span>
            </div>
            <progress id="quiz-progress" value="1" max="3"></progress>

            <form id="quiz-form">
                <fieldset>
                    <legend id="question-text">Завантаження питання...</legend>

                    <div class="options-container" id="options-container">
                        <!-- Динамічно згенеровані radio-кнопки з'являтимуться тут -->
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="submit-btn">Відповісти</button>
                    <button type="button" class="submit-btn" id="next-btn" style="display: none;">Наступне питання</button>
                </div>
            </form>

            <p id="result-feedback" style="margin-top: 1rem; font-weight: bold;"></p>
        </section>

        <!-- Розділ історії спроб -->
        <section id="history-section">
            <h2>Історія спроб</h2>

            <div class="history-cards">
                <article class="history-card">
                    <h3>Спроба від 10.09.2026</h3>
                    <p>Результат: 8/10</p>
                </article>

                <article class="history-card">
                    <h3>Спроба від 11.09.2026</h3>
                    <p>Результат: 10/10</p>
                </article>

                <article class="history-card">
                    <h3>Спроба від 12.09.2026</h3>
                    <p>Результат: 9/10</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 quiz-app. Навчальний проєкт.</p>
    </footer>

</body>
</html>
